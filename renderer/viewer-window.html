<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClothingStudio - 3D view</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body class="popout">
  <div id="stage"></div>
  <div id="plabel">Waiting for ClothingStudio…</div>
  <div id="pbar">
    <button id="pBody" class="mini wide on" title="Show / hide the ped body">Body</button>
    <button id="pReset" class="mini wide" title="Reset camera (R)">Reset</button>
    <button id="pWire" class="mini wide" title="Wireframe (W)">Wire</button>
    <button id="pBack" class="mini wide" title="Dark / light background (B)">Bg</button>
    <button id="pFull" class="mini wide" title="Full screen (F11, F or double-click). Esc leaves full screen">Full screen</button>
  </div>
  <div id="phint">Drag to orbit · wheel to zoom · right-drag to pan · double-click for full screen</div>
  <script type="module" src="js/viewer-window.js"></script>
</body>
</html>
